name: smoke

# Covers the shared guards, audit hooks, Codex task panes, announce size gate,
# and the plugin manifests and skills loaded by both hosts.
#
# tests/smoke-visual-adversary.py stays out. Its browser half drives
# inject-collect.js against a fixture page that ships with the suite, so the
# same script meets the same input locally and on a runner — CI adds no signal
# there, and running it would pull an npm toolchain into a repo that has none.
# Run it by hand after touching watcher/skills/visual-adversary/scripts/.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # smoke-stop-hook and smoke-manifests compare against origin/main.
          fetch-depth: 0

      # jq, Node and Python all ship with the ubuntu-24.04 image
      # (jq 1.7, Node 22.23.2, Python 3.12.3), so nothing is installed.
      - name: Show runtime versions
        run: |
          jq --version
          node --version
          python3 --version

      - name: Announce size gate
        run: |
          bash tests/check-size.sh
          python3 tests/smoke-pr-merge-policy.py

      - name: Announce on both platforms
        run: python3 tests/smoke-announce.py

      - name: Stop hook (Claude Code)
        run: |
          python3 tests/smoke-stop-hook.py
          python3 tests/smoke-manual-audit.py

      - name: Stop hook (Codex)
        run: |
          python3 tests/smoke-stop-hook.py codex
          python3 tests/smoke-manual-audit.py codex

      - name: Bash gate
        run: python3 tests/smoke-bash-gate.py

      - name: Codex effective command context
        run: python3 tests/smoke-codex-gate-context.py

      - name: Literal shell parsing
        run: python3 tests/test-codex-gate-lexer.py

      - name: Task pane storage
        run: python3 tests/test-task-panel-store.py

      - name: Task pane hooks
        run: |
          python3 tests/test-task-panel-hook.py
          python3 tests/test-official-task-panel.py
          python3 tests/test-task-panel-binding.py
          python3 tests/test-task-panel-process.py
          python3 tests/smoke-task-panel-process.py

      - name: Task pane viewer
        run: python3 tests/test-task-panel-viewer.py

      - name: Compact task pane and native acceptance fixture
        run: |
          python3 tests/test-task-panel-compact.py
          python3 tests/test-codex-panel-fixture.py

      - name: Task pane entrypoint
        run: python3 tests/smoke-task-panel.py

      - name: Companion runtime package provenance
        run: python3 tests/test-runtime-package.py

      - name: Plugin manifests and skills
        run: python3 tests/smoke-manifests.py
